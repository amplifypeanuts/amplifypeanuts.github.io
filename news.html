  <!-- ページ切り替えスクリプト -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.news-card');
      const pageBtns = document.querySelectorAll('.page-num');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      let currentPage = 1;
      const maxPage = 3;

      function showPage(page) {
        currentPage = page;
        
        // カードの切り替え
        cards.forEach(card => {
          if (parseInt(card.getAttribute('data-page')) === page) {
            card.style.display = 'flex'; // CSSでflex指定しているため'flex'で表示
          } else {
            card.style.display = 'none';
          }
        });

        // ボタンのActive表示切り替え
        pageBtns.forEach(btn => {
          if (parseInt(btn.getAttribute('data-target')) === page) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // 矢印ボタンの有効/無効切り替え
        prevBtn.disabled = (currentPage === 1);
        nextBtn.disabled = (currentPage === maxPage);
      }

      pageBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const target = parseInt(btn.getAttribute('data-target'));
          showPage(target);
        });
      });

      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) showPage(currentPage - 1);
      });

      nextBtn.addEventListener('click', () => {
        if (currentPage < maxPage) showPage(currentPage + 1);
      });
    });
  </script>
